---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    app.kubernetes.io/managed-by: grauwolf-k8-ops
    grauwolf.io/agent: acme-reviewer
  name: grauwolf-mtls-callers
  namespace: acme-reviewer
spec:
  ingress:
  - ports:
    - port: 8080
      protocol: TCP
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: acme-agent
    ports:
    - port: 8443
      protocol: TCP
  podSelector:
    matchLabels:
      grauwolf.io/agent: acme-reviewer
  policyTypes:
  - Ingress
