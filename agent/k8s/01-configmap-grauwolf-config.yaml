---
apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/managed-by: grauwolf-k8-ops
  name: grauwolf-config
  namespace: acme-agent
data:
  grauwolf.toml: "[credentials.openbao]\naddress = \"http://openbao.openbao.svc:8200\"\nauth = { spiffe = { audience = \"openbao\", role = \"agent-acme-agent\", mount = \"jwt\" } }\nrefresh = \"5m\"\n\n[credentials.variables]\nGRAUWOLF_SERVER_TOKEN = \"openbao:kv/agents/acme-agent/server-token#value\"\n"
