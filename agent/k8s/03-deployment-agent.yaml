---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/managed-by: grauwolf-k8-ops
    app.kubernetes.io/name: grauwolf
    grauwolf.io/agent: agent
  name: agent
  namespace: agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grauwolf
      grauwolf.io/agent: agent
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        grauwolf.io/config-hash: "776a5ad9efe20f23"
      labels:
        app.kubernetes.io/name: grauwolf
        grauwolf.io/agent: agent
    spec:
      automountServiceAccountToken: false
      containers:
      - env:
        - name: SPIFFE_ENDPOINT_SOCKET
          value: "unix:///spiffe-workload-api/agent.sock"
        - name: SPIFFE_FETCH_TIMEOUT
          value: "2m"
        - name: GRAUWOLF_CREDENTIALS
          value: "/etc/grauwolf/grauwolf.toml"
        - name: GRAUWOLF_SPIFFE
          value: "1"
        - name: GRAUWOLF_SPIFFE_PORT
          value: "8443"
        - name: GRAUWOLF_SPIFFE_USERS
          value: "/etc/grauwolf/callers/callers.json"
        - name: GRAUWOLF_SPIFFE_PUBLIC_URL
          value: "https://agent.agent.svc:8443"
        - name: SERVER_PORT
          value: "8080"
        - name: Test
          value: asdasd
        image: "registry.agentswork.de/agent@sha256:1ae38c0bade9954f512cebf63a2c481b90f3a069dd4f3584cb4fa7edee7af727"
        livenessProbe:
          failureThreshold: 6
          httpGet:
            path: "/health"
            port: http
          periodSeconds: 10
          timeoutSeconds: 3
        name: grauwolf
        ports:
        - containerPort: 8080
          name: http
        - containerPort: 8443
          name: mtls
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: "/health"
            port: http
          periodSeconds: 5
          timeoutSeconds: 3
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        startupProbe:
          failureThreshold: 60
          httpGet:
            path: "/health"
            port: http
          periodSeconds: 5
          timeoutSeconds: 3
        volumeMounts:
        - mountPath: "/etc/grauwolf"
          name: config
          readOnly: true
        - mountPath: "/spiffe-workload-api"
          name: spiffe-workload-api
          readOnly: true
        - mountPath: "/data"
          name: data
        - mountPath: "/etc/grauwolf/callers"
          name: callers
          readOnly: true
        workingDir: "/data"
      securityContext:
        fsGroup: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: agent
      volumes:
      - configMap:
          name: grauwolf-config
        name: config
      - csi:
          driver: csi.spiffe.io
          readOnly: true
        name: spiffe-workload-api
      - configMap:
          name: grauwolf-callers
        name: callers
      - emptyDir: {}
        name: data
